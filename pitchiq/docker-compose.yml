services:
  # PitchIQ backend
  # PostgreSQL → Supabase (external)
  # Redis      → Upstash  (external)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
